<!doctype html><html><meta charset="utf-8"><title>KuroWhale · DSH</title>
<style>html,body{margin:0;background:transparent;overflow:hidden}canvas{display:block;touch-action:none}#menu{display:none;position:fixed;inset:4px;overflow:auto;box-sizing:border-box;background:#f6f5fa;border:1px solid #888;border-radius:10px;padding:10px;font:14px 'Segoe UI',sans-serif;color:#222}button,select{display:block;box-sizing:border-box;width:100%;margin:6px 0;padding:6px;border:1px solid #bbb;border-radius:5px;background:#fff;color:#222}small{color:#555}</style>
<canvas id="pet"></canvas><div id="menu"><strong>KuroWhale</strong><select id="state" aria-label="Animation diagnostic"><option>idle</option><option>running-right</option><option>running-left</option><option>waving</option><option>jumping</option><option>failed</option><option>waiting</option><option>running</option><option>review</option></select><button id="resume">恢复自动状态</button><button id="larger">放大 +</button><button id="smaller">缩小 −</button><button id="topmost">切换置顶</button><button id="center">移回屏幕中央</button><button id="hide">隐藏（托盘可恢复）</button><button id="close">关闭桌宠</button><button id="dismiss">关闭菜单</button><small>动画选择仅用于诊断。</small></div>
<script src="neutralino.js"></script><script>
const canvas=document.getElementById('pet'),ctx=canvas.getContext('2d'),menu=document.getElementById('menu'),atlas=new Image();
let initialized=false,loaded=false,layout,position={x:80,y:80},drag=null,directive={row:0,index:0,state:'idle'},seen=new Set(),missingHost=0,onTop=true,uiQueue=Promise.resolve();
const send=(name,data={})=>Neutralino.events.broadcast('kw.'+name,data).catch(()=>{});
const serial=fn=>{uiQueue=uiQueue.then(fn).catch(()=>send('ui-error'));return uiQueue;};
function bounds(){const d=devicePixelRatio;return {x:Math.round((screen.availLeft||0)*d),y:Math.round((screen.availTop||0)*d),w:Math.round(screen.availWidth*d),h:Math.round(screen.availHeight*d)};}
function clamped(p){const b=bounds();return {x:Math.round(Math.max(b.x,Math.min(b.x+Math.max(0,b.w-layout.width),p.x))),y:Math.round(Math.max(b.y,Math.min(b.y+Math.max(0,b.h-layout.height),p.y)))};}
async function move(p){position=clamped(p);await Neutralino.window.move(position.x,position.y);send('position',position);}
function draw(){if(!loaded||!layout)return;ctx.clearRect(0,0,canvas.width,canvas.height);ctx.drawImage(atlas,directive.index*192,directive.row*208,192,208,0,0,Math.round(192*layout.scale),Math.round(208*layout.scale));const key=directive.row+':'+directive.index;if(!seen.has(key)){seen.add(key);send('drawn',{row:directive.row,index:directive.index});}if(directive.trace)send('rendered-frame',{row:directive.row,index:directive.index,time:performance.now()});}
atlas.onload=()=>{if(atlas.naturalWidth!==1536||atlas.naturalHeight!==1872){send('error');return;}loaded=true;draw();const r=canvas.getBoundingClientRect();send('ready',{width:atlas.naturalWidth,height:atlas.naturalHeight,dpr:devicePixelRatio,canvas:{width:canvas.width,height:canvas.height,cssWidth:r.width,cssHeight:r.height},viewport:{width:innerWidth,height:innerHeight},bounds:bounds()});};atlas.onerror=()=>send('error');
Neutralino.events.on('kw.initialize',e=>serial(async()=>{if(initialized){if(loaded)send('ready');return;}initialized=true;layout=e.detail;onTop=layout.topmost;position={x:layout.x,y:layout.y};canvas.width=layout.width;canvas.height=layout.height;canvas.style.width=layout.width/devicePixelRatio+'px';canvas.style.height=layout.height/devicePixelRatio+'px';ctx.imageSmoothingEnabled=true;await move(position);atlas.src='atlas.webp';await setupTray();}));
Neutralino.events.on('kw.topmost',e=>onTop=e.detail.enabled);
Neutralino.events.on('kw.reposition',e=>serial(()=>move(e.detail)));
Neutralino.events.on('kw.frame',e=>{directive=e.detail;draw();});
Neutralino.events.on('extClientDisconnect',e=>{if(e.detail==='kurowhaleHost')Neutralino.app.exit().catch(()=>{});});
setInterval(async()=>{if(!initialized)return;try{const s=await Neutralino.extensions.getStats();missingHost=s.connected.includes('kurowhaleHost')?0:missingHost+1;if(missingHost>=2)await Neutralino.app.exit();}catch{}},5000);
async function dismiss(){menu.style.display='none';await Neutralino.window.setSize({width:layout.width,height:layout.height});await move(position);}
async function openMenu(){drag=null;send('dragEnd',position);await Neutralino.window.setSize({width:Math.max(layout.width,Math.round(260*devicePixelRatio)),height:Math.max(layout.height,Math.round(430*devicePixelRatio))});menu.style.display='block';}
canvas.onpointerenter=()=>{if(!drag)send('hover');};canvas.onpointerleave=()=>{if(!drag)send('unhover');};
canvas.onpointerdown=e=>{if(e.button!==0)return;drag={sx:e.screenX,sy:e.screenY,x:position.x,y:position.y,moved:false};canvas.setPointerCapture(e.pointerId);};
canvas.onpointermove=e=>{if(!drag)return;const dx=(e.screenX-drag.sx)*devicePixelRatio,dy=(e.screenY-drag.sy)*devicePixelRatio;if(Math.abs(dx)+Math.abs(dy)<3)return;drag.moved=true;const p=clamped({x:drag.x+dx,y:drag.y+dy});position=p;Neutralino.window.move(p.x,p.y).catch(()=>{});send('dragMove',{direction:dx<0?'left':'right'});};
canvas.onpointerup=()=>{if(!drag)return;const moved=drag.moved;drag=null;send('dragEnd',moved?position:{});};canvas.onpointercancel=()=>{drag=null;send('dragEnd',position);};
canvas.oncontextmenu=e=>{e.preventDefault();serial(openMenu);};
document.getElementById('dismiss').onclick=()=>serial(dismiss);
document.getElementById('state').onchange=e=>{const value=e.target.value;serial(async()=>{await dismiss();send('control',{action:'state',value});});};
for(const [id,action,value] of [['resume','resume'],['larger','scale',.25],['smaller','scale',-.25],['hide','hide'],['center','center'],['close','close']])document.getElementById(id).onclick=()=>serial(async()=>{await dismiss();send('control',{action,value,relative:action==='scale'});});
document.getElementById('topmost').onclick=()=>serial(async()=>{onTop=!onTop;await dismiss();send('control',{action:'topmost',value:onTop});});
Neutralino.events.on('trayMenuItemClicked',e=>{const action={show:'show',hide:'hide',center:'center',close:'close'}[e.detail.id];if(action)send('control',{action});});
async function setupTray(){try{await Neutralino.os.setTray({icon:'/resources/tray.png',menuItems:[{id:'show',text:'KuroWhale · 显示'},{id:'hide',text:'隐藏'},{id:'center',text:'移回屏幕中央'},{text:'-'},{id:'close',text:'关闭桌宠'}]});send('tray-ready');}catch{send('tray-error');}}
Neutralino.init().catch(()=>{});
</script></html>
