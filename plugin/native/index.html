<style>

<script src="neutralino.js"></script><script>
const stageEl=document.getElementById('stage'),canvas=document.getElementById('pet'),ctx=canvas.getContext('2d'),menu=document.getElementById('menu'),panelEl=document.getElementById('panel'),panelBody=document.getElementById('panelBody'),panelDot=document.getElementById('panelDot'),bubbleEl=document.getElementById('bubble'),badgeEl=document.getElementById('badge'),scaleLabelEl=document.getElementById('scaleLabel');
let atlas=new Image();
const later=typeof setTimeout==='function'?setTimeout:()=>0;
const cancelLater=typeof clearTimeout==='function'?clearTimeout:()=>{};
const raf=typeof requestAnimationFrame==='function'?requestAnimationFrame:null;
let initialized=false,loaded=false,atlasRows=9,layout,position={x:80,y:80},drag=null,directive={row:0,index:0,state:'idle'},seen=new Set(),missingHost=0,onTop=true,uiQueue=Promise.resolve();
let skinSounds={};
let prefs={bubbles:true,patrol:true,hideWhenIdle:false,clickThrough:false,sound:false,dndEnabled:false,dndStart:'23:00',dndEnd:'08:00',toast:true,careReminders:true};
let clickThroughActive=false,wakeHighlight=false,displaysCache=[],lastScreenSig='',sessionsExpanded=false;
let bubbleTimer=0,bubbleClickable=false,bubbleTone='chat',lastClickAt=0,clickTimer=0,menuOpen=false,panelOpen=false;
let panelData={state:'idle',approvals:[],questions:[],planReviews:[],sessions:[],stats:{companion:'<1m',turns:0,tools:0,tokens:'',fishStock:0,feeds:0,streakDays:1},reports:{}};
let reportPreview=null;

// Smooth 60fps true side-profile turn -> walk -> return-turn motion state & micro-particles.
let bounceAnim=null,patrolAnim=null,shakeAnim=null,particles=[],dozeParticleAt=0,rafId=0,moveBusy=false,dragTilt=0;
let clickTimes=[],dizzyCooldownUntil=0,patTrack={lastX:null,acc:0,reversals:0,lastDir:0,at:0,cooldownUntil:0};
const send=(name,data={})=>Neutralino.events.broadcast('kw.'+name,data).catch(()=>{});
const serial=fn=>{uiQueue=uiQueue.then(fn).catch(()=>send('ui-error'));return uiQueue;};
const easeInOut=t=>t<0.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function fallbackBounds(){const d=devicePixelRatio||1;return {x:Math.round((screen.availLeft||0)*d),y:Math.round((screen.availTop||0)*d),w:Math.round(screen.availWidth*d),h:Math.round(screen.availHeight*d)};}
function boundsFor(p){
  const list=Array.isArray(displaysCache)?displaysCache:[];
  if(list.length&&layout){
    const cx=(p?.x??position.x)+(layout.width||248)/2,cy=(p?.y??position.y)+(layout.height||360)/2;
    const hit=list.find(d=>{const wa=d.workArea||d.bounds;return wa&&cx>=wa.x&&cx<wa.x+wa.w&&cy>=wa.y&&cy<wa.y+wa.h;})
      ||list.find(d=>d.primary)||list[0];
    if(hit?.workArea||hit?.bounds)return hit.workArea||hit.bounds;
  }
  return fallbackBounds();
}
function bounds(){return boundsFor(position);}
function clamped(p){const b=boundsFor(p);return {x:Math.round(Math.max(b.x,Math.min(b.x+Math.max(0,b.w-layout.width),p.x))),y:Math.round(Math.max(b.y,Math.min(b.y+Math.max(0,b.h-layout.height),p.y)))};}
function screenSignature(){const d=devicePixelRatio||1;return [screen.availLeft||0,screen.availTop||0,screen.availWidth||0,screen.availHeight||0,d].join(':');}
async function refreshDisplays(){
  try{
    if(typeof Neutralino?.computer?.getDisplays==='function'){
      const res=await Neutralino.computer.getDisplays();
      if(Array.isArray(res)&&res.length){
        displaysCache=res.map((d,i)=>({
          id:d.id??('display-'+i),
          primary:Boolean(d.primary??(i===0)),
          bounds:d.resolution?{x:d.resolution.x??0,y:d.resolution.y??0,w:d.resolution.width??1920,h:d.resolution.height??1080}:(d.bounds||fallbackBounds()),
          workArea:d.workArea||(d.resolution?{x:d.resolution.x??0,y:d.resolution.y??0,w:d.resolution.width??1920,h:d.resolution.height??1040}:fallbackBounds()),
          dpiScale:d.dpi?Math.round((d.dpi/96)*100)/100:1,
        }));
      }
    }
  }catch{}
  return displaysCache;
}
function applyClickThroughClass(){
  if(typeof document!=='undefined'&&document.body?.classList){
    document.body.classList.toggle('click-through',Boolean(clickThroughActive));
  }
}
async function move(p,clamp=true){position=clamp?clamped(p):{x:Math.round(p.x),y:Math.round(p.y)};await Neutralino.window.move(position.x,position.y);send('position',{...position,displays:displaysCache});}
function moveFast(p){
  position=clamped(p);
  if(moveBusy)return;
  moveBusy=true;
  Neutralino.window.move(position.x,position.y).catch(()=>{}).finally(()=>{moveBusy=false;});
}
function ensureMotionLoop(){
  if(!raf||rafId)return;
  const step=now=>{
    rafId=0;
    let active=false;
    if(bounceAnim){
      const t=Math.min(1,(now-bounceAnim.start)/bounceAnim.duration);
      if(t>=1)bounceAnim=null;else active=true;
    }
    if(patrolAnim){
      const elapsed=now-patrolAnim.start;
      const walkEnd=patrolAnim.turnMs+patrolAnim.walkMs;
      if(elapsed<patrolAnim.turnMs){
        patrolAnim.frameIndex=0;
        active=true;
      }else if(elapsed<walkEnd){
        const wt=(elapsed-patrolAnim.turnMs)/patrolAnim.walkMs;
        const e=easeInOut(wt);
        const nx=Math.round(patrolAnim.startX+patrolAnim.deltaX*e);
        if(nx!==position.x)moveFast({x:nx,y:position.y});
        patrolAnim.frameIndex=1+(Math.floor((elapsed-patrolAnim.turnMs)/115)%6);
        active=true;
      }else if(elapsed<walkEnd+patrolAnim.settleMs){
        if(!patrolAnim.landed){
          patrolAnim.landed=true;
          position=clamped({x:patrolAnim.startX+patrolAnim.deltaX,y:position.y});
          Neutralino.window.move(position.x,position.y).catch(()=>{});
        }
        patrolAnim.frameIndex=7;
        active=true;
      }else{
        const donePos={x:position.x,y:position.y};
        patrolAnim=null;
        send('patrolDone',donePos);
      }
    }
    if(shakeAnim){
      const st=(now-shakeAnim.start)/shakeAnim.duration;
      if(st>=1)shakeAnim=null;else active=true;
    }
    if(particles.length){
      particles=particles.filter(p=>now-p.start<p.ttl);
      if(particles.length)active=true;
    }
    if(directive.state==='dozing'&&!patrolAnim&&!drag&&!menuOpen&&!panelOpen){
      if(now-dozeParticleAt>=950){dozeParticleAt=now;spawnParticles('zzz');}
      active=true;
    }
    if(drag&&Math.abs(dragTilt)>0.002){dragTilt*=0.86;active=true;}
    else if(!drag&&Math.abs(dragTilt)>0.002){dragTilt*=0.78;if(Math.abs(dragTilt)<0.002)dragTilt=0;else active=true;}
    draw(now);
    if(active)rafId=raf(step);
  };
  rafId=raf(step);
}
function triggerBounce(duration=200){
  bounceAnim={start:performance.now(),duration};
  ensureMotionLoop();
}
function spawnParticles(kind){
  if(!layout)return;
  const now=performance.now();
  const pw=layout.petWidth??Math.round(192*layout.scale);
  const ph=layout.petHeight??Math.round(208*layout.scale);
  const cx=Math.floor(layout.width/2);
  const headY=(layout.bubbleSpace??0)+ph*0.18;
  const s=Math.max(0.75,layout.scale||1);
  if(kind==='heart'){
    for(let i=0;i<5;i++)particles.push({kind:'heart',char:i%2?'♥':'✦',color:i%2?'#f28ab2':'#ffe2ec',x:cx+(Math.random()-0.5)*pw*0.48,y:headY+Math.random()*12*s,vx:(Math.random()-0.5)*14*s,vy:-(20+Math.random()*14)*s,size:Math.round((10+Math.random()*4)*s),start:now,ttl:900});
  }else if(kind==='sparkle'){
    for(let i=0;i<5;i++)particles.push({kind:'sparkle',char:i%2?'✦':'✧',color:i%2?'#ffd875':'#dbe6ff',x:cx+(Math.random()-0.5)*pw*0.56,y:headY+ph*0.24+(Math.random()-0.5)*16*s,vx:(Math.random()-0.5)*28*s,vy:-(14+Math.random()*18)*s,size:Math.round((10+Math.random()*4)*s),start:now,ttl:750});
  }else if(kind==='dizzy'){
    for(let i=0;i<3;i++)particles.push({kind:'dizzy',char:'★',color:'#f4c96b',x:cx,y:headY-4*s,phase:i*Math.PI*2/3,rx:pw*0.24,ry:6*s,size:Math.round(11*s),start:now,ttl:1100});
  }else if(kind==='zzz'){
    particles.push({kind:'zzz',char:'z',color:'#d8e2ff',x:cx+pw*0.22,y:headY+4*s,vx:10*s,vy:-18*s,size:Math.round(12*s),start:now,ttl:1450});
  }else if(kind==='milestone'){
    for(let i=0;i<8;i++)particles.push({kind:'milestone',char:i%3===0?'★':(i%2?'♥':'✦'),color:i%3===0?'#ffd875':(i%2?'#ff98c3':'#9ac6ff'),x:cx+(Math.random()-0.5)*pw*0.64,y:headY+Math.random()*16*s,vx:(Math.random()-0.5)*36*s,vy:-(24+Math.random()*22)*s,size:Math.round((11+Math.random()*5)*s),start:now,ttl:1100});
  }
  if(particles.length>14)particles=particles.slice(-14);
  ensureMotionLoop();
}
function triggerFx(fx={}){
  if(fx.bounce)triggerBounce(240);
  if(fx.shake){shakeAnim={start:performance.now(),duration:900};ensureMotionLoop();}
  if(fx.kind)spawnParticles(fx.kind);
}
function drawParticles(now){
  if(!particles.length||typeof ctx.save!=='function'||typeof ctx.fillText!=='function')return;
  ctx.save();
  ctx.textAlign='center';
  ctx.textBaseline='middle';
  for(const p of particles){
    const t=(now-p.start)/p.ttl;
    if(t<0||t>=1)continue;

function draw(now=performance.now()){
  if(!loaded||!layout)return;
  ctx.clearRect(0,0,canvas.width,canvas.height);
  const pw=layout.petWidth??Math.round(192*layout.scale);
  const ph=layout.petHeight??Math.round(208*layout.scale);
  const px=Math.max(0,Math.floor((layout.width-pw)/2));
  const py=layout.bubbleSpace??0;
  const drawRow=patrolAnim?patrolAnim.row:directive.row;
  const drawIndex=patrolAnim?patrolAnim.frameIndex:directive.index;
  const fallbackRow={9:3,10:0,11:8};
  const safeRow=drawRow<atlasRows?drawRow:(fallbackRow[drawRow]??0);
  let hopY=0,shakeX=0,tilt=dragTilt,sx=1,sy=1;
  if(patrolAnim){
    const elapsed=now-patrolAnim.start;
    if(elapsed>=patrolAnim.turnMs&&elapsed<patrolAnim.turnMs+patrolAnim.walkMs){
      tilt+=patrolAnim.dir*0.02;
    }
  }
  if(shakeAnim){
    const st=Math.min(1,(now-shakeAnim.start)/shakeAnim.duration);
    const wave=Math.sin(st*Math.PI*8)*(1-st);

    tilt+=wave*0.07;
  }

  }

    ctx.translate(px+pw/2+shakeX,py+ph+hopY);
    if(tilt)ctx.rotate(tilt);
    ctx.scale(sx,sy);
    ctx.drawImage(atlas,drawIndex*192,safeRow*208,192,208,-pw/2,-ph,pw,ph);
    ctx.restore();

    ctx.drawImage(atlas,drawIndex*192,safeRow*208,192,208,px,py,pw,ph);
  }

  if(!seen.has(key)){seen.add(key);send('drawn',{row:drawRow,index:drawIndex});}

function playChime(tone='waiting'){

  if(customSrc&&typeof Audio==='function'){

function playSynthChime(tone='waiting'){
  try{
    const AC=typeof AudioContext!=='undefined'?AudioContext:(typeof webkitAudioContext!=='undefined'?webkitAudioContext:null);
    if(!AC)return;
    const ac=new AC();const now=ac.currentTime;
    const profiles={
      waiting:{type:'sine',notes:[[659.25,0,0.06,0.22],[880,0.11,0.06,0.22]]},
      review:{type:'triangle',notes:[[523.25,0,0.045,0.16],[659.25,0.09,0.045,0.18],[783.99,0.18,0.05,0.22]]},
      failed:{type:'sine',notes:[[293.66,0,0.055,0.18],[246.94,0.13,0.055,0.24]]},
    };
    const spec=profiles[tone]||profiles.waiting;
    for(const [freq,offset,peak,dur] of spec.notes){
      const osc=ac.createOscillator(),gain=ac.createGain();
      osc.type=spec.type;osc.frequency.setValueAtTime(freq,now+offset);
      gain.gain.setValueAtTime(0.001,now+offset);
      gain.gain.exponentialRampToValueAtTime(peak,now+offset+0.02);
      gain.gain.exponentialRampToValueAtTime(0.001,now+offset+dur);
      osc.connect(gain);gain.connect(ac.destination);
      osc.start(now+offset);osc.stop(now+offset+dur+0.02);
    }
    later(()=>{try{ac.close();}catch{}},650);
  }catch{}
}

// Position menu or task card BESIDE the character (right side by default, auto-flip to left near screen edge)
// so the pet stays completely unobstructed and stationary on screen.
async function openBeside(el,drawerCssW,drawerCssH){
  const d=devicePixelRatio||1;
  const gapCss=8;
  const drawerW=Math.round(drawerCssW*d),gap=Math.round(gapCss*d);
  const totalW=layout.width+gap+drawerW;
  const totalH=Math.max(layout.height,Math.round((drawerCssH+16)*d));
  const b=bounds();
  const fitsRight=position.x+totalW<=b.x+b.w-4;
  let winX=position.x;
  let stageLeftCss=0,drawerLeftCss=layout.width/d+gapCss;
  if(!fitsRight){
    winX=Math.max(b.x+4,position.x-gap-drawerW);
    const shift=position.x-winX;
    stageLeftCss=shift/d;
    drawerLeftCss=0;
  }
  const winY=Math.max(b.y+4,Math.min(b.y+Math.max(0,b.h-totalH),position.y));
  if(stageEl)stageEl.style.left=stageLeftCss+'px';
  if(el){
    el.style.left=drawerLeftCss+'px';
    el.style.width=drawerCssW+'px';
    el.style.maxHeight=(totalH/d-16)+'px';
  }
  await Neutralino.window.setSize({width:totalW,height:totalH,resizable:false});
  await Neutralino.window.move(winX,winY);
  if(el)el.style.display='block';
}
async function closeOverlays(){
  menuOpen=false;panelOpen=false;
  if(menu)menu.style.display='none';
  if(panelEl)panelEl.style.display='none';
  if(stageEl)stageEl.style.left='0px';
  await Neutralino.window.setSize({width:layout.width,height:layout.height,resizable:false});
  await move(position);
  send('overlayState',{open:false});
}
async function openMenu(){
  menuOpen=true;panelOpen=false;stopLocalPatrol();drag=null;send('dragEnd',position);showBubble({clear:true});syncMenuLabels();
  send('overlayState',{open:true});

  await openBeside(menu,228,376);
}
async function openPanelView(){
  panelOpen=true;menuOpen=false;stopLocalPatrol();drag=null;send('dragEnd',position);showBubble({clear:true});renderPanel();

  const hasWaiting=(panelData.approvals?.length||0)+(panelData.questions?.length||0)+(panelData.planReviews?.length||0)>0;
  const activeCount=(panelData.sessions||[]).filter(s=>s.state!=='idle').length;
  const h=(hasWaiting?336:256)+(sessionsExpanded&&activeCount>2?Math.min(120,(activeCount-2)*34):0)+(reportPreview?.dataUrl?185:0);
  await openBeside(panelEl,276,h);
}

  else if(act==='stop')serial(async()=>{send('control',{action:'cancel-session',alias:btn.dataset.alias});});
  else if(act==='focus')serial(async()=>{await closeOverlays();send('control',{action:'focus'});});
};
function pointerZone(e){
  if(!layout)return 'head';
  const r=canvas.getBoundingClientRect?canvas.getBoundingClientRect():null;
  const cssScale=r&&r.height?layout.height/r.height:(devicePixelRatio||1);
  const cy=r&&Number.isFinite(e?.clientY)?(e.clientY-r.top)*cssScale:(layout.bubbleSpace??0);
  const py=layout.bubbleSpace??0,ph=layout.petHeight??Math.round(208*layout.scale);
  return (cy-py)/Math.max(1,ph)<0.46?'head':'body';
}
canvas.onpointerenter=()=>{if(!drag&&!patrolAnim)send('hover');};
canvas.onpointerleave=()=>{patTrack.lastX=null;patTrack.acc=0;patTrack.reversals=0;patTrack.lastDir=0;if(!drag&&!patrolAnim)send('unhover');};
canvas.onpointerdown=e=>{if(e.button!==0)return;if(menuOpen||panelOpen){serial(closeOverlays);return;}stopLocalPatrol();drag={sx:e.screenX,sy:e.screenY,lastX:e.screenX,x:position.x,y:position.y,moved:false};if(canvas.setPointerCapture)canvas.setPointerCapture(e.pointerId);};
canvas.onpointermove=e=>{
  if(!drag){
    if(!loaded||menuOpen||panelOpen||patrolAnim||pointerZone(e)!=='head'){patTrack.lastX=null;patTrack.acc=0;patTrack.reversals=0;patTrack.lastDir=0;return;}
    const now=Date.now();
    if(patTrack.lastX===null||now-patTrack.at>900){patTrack.lastX=e.screenX;patTrack.acc=0;patTrack.reversals=0;patTrack.lastDir=0;patTrack.at=now;return;}
    const mdx=e.screenX-patTrack.lastX;patTrack.lastX=e.screenX;
    if(Math.abs(mdx)<2)return;
    const mdir=mdx>0?1:-1;
    if(patTrack.lastDir&&mdir!==patTrack.lastDir)patTrack.reversals++;
    patTrack.lastDir=mdir;patTrack.acc+=Math.abs(mdx);patTrack.at=now;
    if(patTrack.acc>=42&&patTrack.reversals>=1&&now>=patTrack.cooldownUntil){
      patTrack.cooldownUntil=now+2200;patTrack.acc=0;patTrack.reversals=0;
      triggerBounce(260);spawnParticles('heart');send('interact',{kind:'head-pat'});
    }
    return;
  }
  const d=devicePixelRatio||1;
  const dx=(e.screenX-drag.sx)*d,dy=(e.screenY-drag.sy)*d;
  if(Math.abs(dx)+Math.abs(dy)<3)return;
  const vx=e.screenX-drag.lastX;drag.lastX=e.screenX;
  drag.moved=true;
  dragTilt=Math.max(-0.14,Math.min(0.14,-vx*0.01));
  ensureMotionLoop();
  const p={x:Math.round(drag.x+dx),y:Math.round(drag.y+dy)};
  position=p;Neutralino.window.move(p.x,p.y).catch(()=>{});
  send('dragMove',{direction:vx<0?'left':vx>0?'right':(dx<0?'left':'right')});
};
canvas.onpointerup=e=>{
  if(!drag)return;
  const moved=drag.moved;drag=null;
  if(moved)triggerBounce(240);
  send('dragEnd',moved?position:{});
  if(!moved){
    const zone=pointerZone(e);
    const now=Date.now();
    clickTimes=clickTimes.filter(t=>now-t<2200);
    clickTimes.push(now);
    if(clickTimes.length>=4&&now>=dizzyCooldownUntil){
      cancelLater(clickTimer);lastClickAt=0;clickTimes=[];dizzyCooldownUntil=now+2500;
      shakeAnim={start:performance.now(),duration:900};spawnParticles('dizzy');ensureMotionLoop();
      send('interact',{kind:'dizzy'});
      return;
    }
    if(now-lastClickAt<320){cancelLater(clickTimer);lastClickAt=0;send('dblclick');}
    else{lastClickAt=now;clickTimer=later(()=>{lastClickAt=0;triggerBounce(220);spawnParticles(zone==='head'?'heart':'sparkle');send('interact',{kind:zone==='head'?'head-tap':'body-poke'});},260);}
  }
};
canvas.onpointercancel=()=>{drag=null;triggerBounce(200);send('dragEnd',position);};
